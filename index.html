<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 문장 끊어읽기 &amp; 청크 분석 연습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; color: #2c2c2a; }
.app { max-width: 860px; width: 100%; }
h1 { font-size: 21px; font-weight: 600; color: #1a1a18; margin-bottom: 0.25rem; }
.subtitle { font-size: 14px; color: #888; margin-bottom: 1.25rem; }

.tabs { display: flex; gap: 6px; margin-bottom: 1.1rem; border-bottom: 1px solid #e8e8e6; }
.tab-btn { background: transparent; border: none; padding: 0.65rem 0.9rem; font-size: 14px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn:hover { color: #185FA5; }
.tab-btn.active { color: #185FA5; border-bottom-color: #185FA5; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.card { background: #fff; border: 1px solid #e8e8e6; border-radius: 14px; padding: 1.25rem 1.4rem; margin-bottom: 1.25rem; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 0.75rem; color: #1a1a18; }
.card h3 { font-size: 13px; font-weight: 600; margin: 1rem 0 0.5rem; color: #444; }
.hint { font-size: 12.5px; color: #999; line-height: 1.6; margin-bottom: 0.75rem; }
.hint code { background: #f0f0ee; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

label { display: block; font-size: 12.5px; color: #666; margin-bottom: 4px; font-weight: 500; }
input[type=text], textarea, select {
  width: 100%; border: 1px solid #dcdcd8; border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 14px; font-family: inherit; background: #fafaf8; color: #1a1a18;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: #185FA5; background: #fff; }
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.field { margin-bottom: 0.85rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.btn { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 0.6rem 1.1rem; font-size: 13.5px; cursor: pointer; color: #444; font-weight: 500; }
.btn:hover { background: #f0f0ee; }
.btn.primary { background: #185FA5; color: #fff; border-color: transparent; }
.btn.primary:hover { background: #0c447c; }
.btn.danger { color: #b33; border-color: #eecccc; }
.btn.danger:hover { background: #fdf0f0; }
.btn.small { padding: 0.35rem 0.7rem; font-size: 12.5px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; align-items: center; }

/* level pills */
.level-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.1rem; }
.level-pill { background: #fff; border: 1px solid #dcdcd8; border-radius: 999px; padding: 0.45rem 0.95rem; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.level-pill:hover { border-color: #185FA5; color: #185FA5; }
.level-pill.active { background: #185FA5; border-color: #185FA5; color: #fff; }
.level-pill .prog { font-size: 10.5px; font-weight: 500; opacity: 0.85; }

/* track pills */
.track-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.9rem; }
.track-pill { background: #fff; border: 1px solid #dcdcd8; border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 12.5px; font-weight: 600; color: #666; cursor: pointer; }
.track-pill:hover { border-color: #185FA5; color: #185FA5; }
.track-pill.active { background: #eaf1fb; border-color: #185FA5; color: #185FA5; }

/* tag colors */
.tag-S { background: #eaf1fb; color: #185FA5; border: 1px solid #b9d3f0; }
.tag-V { background: #fdecec; color: #c0392b; border: 1px solid #f3c2c2; }
.tag-O { background: #eaf7ee; color: #1e8449; border: 1px solid #bfe6cc; }
.tag-C { background: #f3ecfb; color: #7d3c98; border: 1px solid #d9c2ef; }
.tag-M { background: #fdf3e3; color: #b9770e; border: 1px solid #f2ddb0; }

.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 0.9rem; font-size: 12.5px; }
.legend-item { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }

/* sentence chunk display */
.chunk-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 0.9rem 0 0.35rem; }
.chunk-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chunk-word { border-radius: 8px; padding: 0.4rem 0.65rem; font-size: 15px; font-weight: 500; line-height: 1.3; }
.chunk-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 999px; }
.sent-meta { font-size: 12.5px; color: #888; margin-top: 0.4rem; }
.sent-grammar { display: inline-block; background: #f0f0ee; color: #555; border-radius: 6px; padding: 1px 8px; font-size: 11.5px; margin-right: 6px; }
.sent-note { font-size: 12px; color: #a67c00; background: #fffaf0; border: 1px solid #f2e2b8; border-radius: 8px; padding: 0.5rem 0.7rem; margin-top: 0.5rem; line-height: 1.55; }

/* study list */
.sentence-item { border: 1px solid #e8e8e6; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 10px; cursor: pointer; }
.sentence-item:hover { border-color: #185FA5; }
.sentence-item.open { border-color: #185FA5; background: #fafcff; }
.sentence-item .sent-text { font-size: 14.5px; font-weight: 500; color: #1a1a18; }
.sentence-item .sent-summary { font-size: 12px; color: #999; margin-top: 3px; }
.custom-badge { background: #185FA5; color: #fff; border-radius: 5px; padding: 0 6px; font-size: 10.5px; margin-left: 6px; }

/* practice */
.practice-progress { font-size: 12.5px; color: #888; margin-bottom: 0.5rem; }
.practice-sentence-src { font-size: 13px; color: #aaa; margin-bottom: 0.6rem; }
.pchunk { border: 2px solid #ddd; border-radius: 8px; padding: 0.4rem 0.65rem; font-size: 15px; font-weight: 500; cursor: pointer; background: #fafaf8; color: #333; position: relative; }
.pchunk.selected { border-color: #185FA5; box-shadow: 0 0 0 2px #d6e6f7; }
.pchunk .assigned-tag { position: absolute; top: -10px; right: -6px; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 0px 5px; }
.pchunk.graded-correct { border-color: #1e8449; }
.pchunk.graded-wrong { border-color: #c0392b; }
.mark { font-size: 13px; font-weight: 800; margin-left: 4px; }
.mark.ok { color: #1e8449; }
.mark.no { color: #c0392b; }

.tag-picker { display: flex; gap: 8px; margin: 1rem 0; flex-wrap: wrap; }
.tag-btn { border: none; border-radius: 8px; padding: 0.55rem 1.2rem; font-size: 14px; font-weight: 700; cursor: pointer; }
.tag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.tag-btn-S { background: #eaf1fb; color: #185FA5; }
.tag-btn-V { background: #fdecec; color: #c0392b; }
.tag-btn-O { background: #eaf7ee; color: #1e8449; }
.tag-btn-C { background: #f3ecfb; color: #7d3c98; }
.tag-btn-M { background: #fdf3e3; color: #b9770e; }
.tag-btn:hover:not(:disabled) { filter: brightness(0.95); }

.result-box { margin-top: 1rem; padding: 0.85rem 1rem; border-radius: 10px; background: #f7faf7; border: 1px solid #dceedd; font-size: 14px; }
.result-box.bad { background: #fdf5f5; border-color: #f2d6d6; }
.wrong-list { font-size: 12.5px; color: #666; margin-top: 6px; line-height: 1.8; }

.translate-block { margin-top: 1rem; }
.translate-block label { margin-bottom: 6px; }
.translate-block textarea { min-height: 56px; }
.compare-block { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 8px; }
.compare-row { border-radius: 8px; padding: 0.55rem 0.75rem; font-size: 13.5px; line-height: 1.6; }
.compare-row .compare-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; display: block; margin-bottom: 2px; }
.compare-row.mine { background: #fafaf8; border: 1px solid #eee; color: #444; }
.compare-row.model { background: #eaf7ee; border: 1px solid #bfe6cc; color: #1e6b3a; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat-cell { background: #fafaf8; border: 1px solid #eee; border-radius: 10px; padding: 0.6rem 0.75rem; text-align: center; }
.stat-cell .num { font-size: 17px; font-weight: 700; color: #185FA5; }
.stat-cell .lbl { font-size: 11px; color: #999; margin-top: 2px; }

.custom-chunk-preview { display: flex; gap: 6px; flex-wrap: wrap; margin: 0.5rem 0; }
.empty-note { color: #bbb; font-size: 12.5px; }
@media (max-width: 560px) {
  .row2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <h1>🧩 영어 문장 끊어읽기 연습</h1>
  <p class="subtitle">문장을 주어(S) · 동사(V) · 목적어(O) · 보어(C) · 수식어(M) 덩어리로 나누어 보고, 직접 표시하며 연습해요</p>

  <div class="level-row" id="levelRow"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="study">📖 학습</button>
    <button class="tab-btn" data-tab="practice">✍️ 연습 문제</button>
    <button class="tab-btn" data-tab="add">➕ 문장 추가</button>
    <button class="tab-btn" data-tab="stats">📊 학습 현황</button>
  </nav>

  <!-- 학습 탭 -->
  <section id="tab-study" class="tab-panel active">
    <div class="card">
      <h2 id="studyLevelTitle">학습</h2>
      <div class="legend" id="legendStudy"></div>
      <div id="studyList"></div>
    </div>
  </section>

  <!-- 연습 탭 -->
  <section id="tab-practice" class="tab-panel">
    <div class="card">
      <h2>청크 분석 연습</h2>
      <div class="track-row" id="trackRow"></div>
      <div class="legend" id="legendPractice"></div>
      <div class="practice-progress" id="practiceProgress"></div>
      <div id="practiceArea"></div>
    </div>
  </section>

  <!-- 문장 추가 탭 -->
  <section id="tab-add" class="tab-panel">
    <div class="card">
      <h2>내 문장 추가하기</h2>
      <p class="hint">
        문장을 원하는 청크 단위로 <code>/</code> 로 구분해서 입력하면, 각 청크에 태그(S/V/O/C/M)를 지정할 수 있어요.<br>
        예: <code>She / gave / me / a nice present.</code>
      </p>
      <div class="field">
        <label>난이도</label>
        <select id="addLevel"></select>
      </div>
      <div class="field">
        <label>문법 포인트 (선택)</label>
        <input type="text" id="addGrammar" placeholder="예: 3형식 문장">
      </div>
      <div class="field">
        <label>청크 구분 입력 (/ 로 구분)</label>
        <textarea id="addChunksRaw" placeholder="예: She / gave / me / a nice present."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn" id="addParseBtn">청크 나누기</button>
      </div>
      <div id="addChunkTagArea"></div>
      <div class="field" style="margin-top:0.75rem;">
        <label>한글 해석 (선택)</label>
        <input type="text" id="addTranslation" placeholder="예: 그녀는 나에게 멋진 선물을 주었다.">
      </div>
      <div class="btn-row">
        <button class="btn primary" id="addSaveBtn">이 문장 저장하기</button>
      </div>
    </div>

    <div class="card">
      <h2>내가 추가한 문장</h2>
      <div id="customList"></div>
    </div>
  </section>

  <!-- 학습 현황 탭 -->
  <section id="tab-stats" class="tab-panel">
    <div class="card">
      <h2>난이도별 학습 현황</h2>
      <div id="statsWrap"></div>
      <div class="btn-row" style="margin-top:1rem;">
        <button class="btn danger" id="resetStatsBtn">🗑️ 기록 초기화</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ================= data ================= */
const LEVELS = ['중1', '중2', '중3', '고1', '고2', '고3'];
const TAGS = ['S', 'V', 'O', 'C', 'M'];
const TAG_NAMES = { S: '주어', V: '동사', O: '목적어', C: '보어', M: '수식어' };

function c(t, g) { return { t, g }; }

const SENTENCES = [
  // ---------------- 중1 ----------------
  { id:'m1-1', level:'중1', text:'I am a student.', grammar:'2형식 (be동사+보어)', translation:'나는 학생이다.',
    chunks:[c('I','S'),c('am','V'),c('a student.','C')] },
  { id:'m1-2', level:'중1', text:'She likes cats.', grammar:'3형식', translation:'그녀는 고양이를 좋아한다.',
    chunks:[c('She','S'),c('likes','V'),c('cats.','O')] },
  { id:'m1-3', level:'중1', text:'We play soccer after school.', grammar:'3형식 + 시간 수식어', translation:'우리는 방과 후에 축구를 한다.',
    chunks:[c('We','S'),c('play','V'),c('soccer','O'),c('after school.','M')] },
  { id:'m1-4', level:'중1', text:'The weather is nice today.', grammar:'2형식 + 시간 부사', translation:'오늘 날씨가 좋다.',
    chunks:[c('The weather','S'),c('is','V'),c('nice','C'),c('today.','M')] },
  { id:'m1-5', level:'중1', text:'He runs fast every morning.', grammar:'1형식 + 부사 수식어', translation:'그는 매일 아침 빠르게 달린다.',
    chunks:[c('He','S'),c('runs','V'),c('fast','M'),c('every morning.','M')] },
  { id:'m1-6', level:'중1', text:'My brother is very tall.', grammar:'2형식', translation:'내 형[남동생]은 키가 매우 크다.',
    chunks:[c('My brother','S'),c('is','V'),c('very tall.','C')] },
  { id:'m1-7', level:'중1', text:'They watch TV in the evening.', grammar:'3형식 + 장소/시간 수식어', translation:'그들은 저녁에 TV를 본다.',
    chunks:[c('They','S'),c('watch','V'),c('TV','O'),c('in the evening.','M')] },
  { id:'m1-8', level:'중1', text:'I go to school by bus.', grammar:'1형식 + 전치사구 수식어', translation:'나는 버스를 타고 학교에 간다.',
    chunks:[c('I','S'),c('go','V'),c('to school','M'),c('by bus.','M')] },
  { id:'m1-9', level:'중1', text:'There are many books on the desk.', grammar:'there is/are 구문', translation:'책상 위에 책이 많이 있다.',
    note:'There는 뜻이 없는 유도부사예요. 진짜 주어는 그 뒤에 나오는 many books예요.',
    chunks:[c('There','M'),c('are','V'),c('many books','S'),c('on the desk.','M')] },
  { id:'m1-10', level:'중1', text:'She gave her friend a nice present.', grammar:'4형식 (수여동사)', translation:'그녀는 친구에게 멋진 선물을 주었다.',
    note:'수여동사 문장은 목적어가 두 개예요. (간접목적어: her friend, 직접목적어: a nice present)',
    chunks:[c('She','S'),c('gave','V'),c('her friend','O'),c('a nice present.','O')] },
  { id:"m1-11", level:"중1", text:"My mother cooks dinner every evening.", grammar:"3형식 문장 (S+V+O) + 시간 수식어", translation:"나의 어머니는 매일 저녁 식사를 요리하신다.",
    chunks:[c("My mother","S"),c("cooks","V"),c("dinner","O"),c("every evening.","M")] },
  { id:"m1-12", level:"중1", text:"The children play in the park.", grammar:"1형식 문장 (S+V) + 장소 수식어", translation:"아이들은 공원에서 논다.",
    chunks:[c("The children","S"),c("play","V"),c("in the park.","M")] },
  { id:"m1-13", level:"중1", text:"Her new bag is red.", grammar:"2형식 문장 (be동사 + 형용사 보어)", translation:"그녀의 새 가방은 빨간색이다.",
    chunks:[c("Her new bag","S"),c("is","V"),c("red.","C")] },
  { id:"m1-14", level:"중1", text:"I often visit my grandmother.", grammar:"3형식 문장 + 빈도부사", translation:"나는 종종 할머니를 방문한다.",
    chunks:[c("I","S"),c("often","M"),c("visit","V"),c("my grandmother.","O")] },
  { id:"m1-15", level:"중1", text:"There is a cat under the table.", grammar:"There is 구문 (2형식 변형)", translation:"탁자 아래에 고양이가 있다.", note:"There is/are 구문에서 There는 수식어(M)로, is/are 뒤에 오는 명사가 진짜 주어(S)예요.",
    chunks:[c("There","M"),c("is","V"),c("a cat","S"),c("under the table.","M")] },
  { id:"m1-16", level:"중1", text:"My father gave me a new bicycle.", grammar:"4형식 문장 (수여동사 gave)", translation:"아버지는 나에게 새 자전거를 주셨다.", note:"gave 뒤에 사람(간접목적어)과 사물(직접목적어) 두 개의 목적어가 와요.",
    chunks:[c("My father","S"),c("gave","V"),c("me","O"),c("a new bicycle.","O")] },
  { id:"m1-17", level:"중1", text:"The soup smells delicious.", grammar:"2형식 문장 (감각동사 smell + 형용사 보어)", translation:"그 수프는 맛있는 냄새가 난다.",
    chunks:[c("The soup","S"),c("smells","V"),c("delicious.","C")] },
  { id:"m1-18", level:"중1", text:"We usually eat breakfast at seven.", grammar:"3형식 문장 + 빈도부사 + 시간 수식어", translation:"우리는 보통 7시에 아침을 먹는다.",
    chunks:[c("We","S"),c("usually","M"),c("eat","V"),c("breakfast","O"),c("at seven.","M")] },
  { id:"m1-19", level:"중1", text:"My sister became a doctor last year.", grammar:"2형식 문장 (become + 명사 보어)", translation:"나의 언니는 작년에 의사가 되었다.", note:"become 뒤에는 명사나 형용사가 보어(C)로 와서 주어의 상태 변화를 나타내요.",
    chunks:[c("My sister","S"),c("became","V"),c("a doctor","C"),c("last year.","M")] },
  { id:"m1-20", level:"중1", text:"The students study English in the library.", grammar:"3형식 문장 + 장소 수식어", translation:"학생들은 도서관에서 영어를 공부한다.",
    chunks:[c("The students","S"),c("study","V"),c("English","O"),c("in the library.","M")] },
  { id:"m1-21", level:"중1", text:"There are two dogs in the yard.", grammar:"There are 구문 (복수 주어)", translation:"마당에 개 두 마리가 있다.",
    chunks:[c("There","M"),c("are","V"),c("two dogs","S"),c("in the yard.","M")] },
  { id:"m1-22", level:"중1", text:"My uncle sent me a letter.", grammar:"4형식 문장 (수여동사 sent)", translation:"삼촌은 나에게 편지를 보내셨다.",
    chunks:[c("My uncle","S"),c("sent","V"),c("me","O"),c("a letter.","O")] },
  { id:"m1-23", level:"중1", text:"The music sounds wonderful.", grammar:"2형식 문장 (감각동사 sound + 형용사 보어)", translation:"그 음악은 멋지게 들린다.",
    chunks:[c("The music","S"),c("sounds","V"),c("wonderful.","C")] },
  { id:"m1-24", level:"중1", text:"I sometimes lose my umbrella.", grammar:"3형식 문장 + 빈도부사", translation:"나는 가끔 우산을 잃어버린다.",
    chunks:[c("I","S"),c("sometimes","M"),c("lose","V"),c("my umbrella.","O")] },

    chunks:[c("It was not until she lost everything that","M"),c("she","S"),c("understood","V"),c("its value.","O")] },
  { id:"h2-48", level:"고2", text:"What drives human creativity continues to intrigue psychologists.", grammar:"명사절 주어 (what)", translation:"무엇이 인간의 창의성을 이끄는지는 여전히 심리학자들의 흥미를 끈다.", note:"what이 이끄는 명사절이 문장 전체의 주어 역할을 하는 구문이에요.",
    chunks:[c("What drives human creativity","S"),c("continues to intrigue","V"),c("psychologists.","O")] },
  { id:"h2-49", level:"고2", text:"Whether a democracy survives hinges on the trust citizens place in it.", grammar:"명사절 주어 (whether)", translation:"민주주의가 존속하느냐는 시민들이 그것에 두는 신뢰에 달려 있다.", note:"whether가 이끄는 명사절이 문장 전체의 주어 역할을 하는 구문이에요.",
    chunks:[c("Whether a democracy survives","S"),c("hinges","V"),c("on the trust citizens place in it.","M")] },
  { id:"h2-50", level:"고2", text:"What truly motivates generosity is rarely the desire for recognition.", grammar:"명사절 주어 (what)", translation:"진정으로 관대함을 움직이는 것은 인정받고자 하는 욕구인 경우가 드물다.", note:"what이 이끄는 명사절이 문장 전체의 주어 역할을 하는 구문이에요.",
    chunks:[c("What truly motivates generosity","S"),c("is","V"),c("rarely","M"),c("the desire for recognition.","C")] },

  // ---------------- 고3 ----------------
  { id:'h3-1', level:'고3', text:'It is widely believed that regular exercise improves both physical and mental health.', grammar:'가주어 it / 진주어 that절', translation:'규칙적인 운동이 신체적, 정신적 건강을 모두 향상시킨다고 널리 믿어진다.',
    note:'that절이 실제로는 진짜 주어 역할을 하는 가주어 it 구문이에요.',
    chunks:[c('It','S'),c('is widely believed','V'),c('that regular exercise improves both physical and mental health.','M')] },
  { id:'h3-2', level:'고3', text:'The extent to which technology has transformed our daily lives cannot be overstated.', grammar:'전치사+관계대명사(to which)절이 주어를 수식', translation:'기술이 우리의 일상생활을 변화시킨 정도는 아무리 강조해도 지나치지 않다.',
    chunks:[c('The extent to which technology has transformed our daily lives','S'),c('cannot be overstated.','V')] },
  { id:'h3-3', level:'고3', text:'Having been exposed to various cultures, she developed a more open mindset.', grammar:'완료 수동 분사구문', translation:'다양한 문화에 노출된 후, 그녀는 더 개방적인 사고방식을 갖게 되었다.',
    chunks:[c('Having been exposed to various cultures,','M'),c('she','S'),c('developed','V'),c('a more open mindset.','O')] },
  { id:'h3-4', level:'고3', text:'Whether we succeed or fail depends largely on our attitude.', grammar:'명사절(whether) 주어', translation:'우리가 성공하느냐 실패하느냐는 대체로 우리의 태도에 달려 있다.',
    chunks:[c('Whether we succeed or fail','S'),c('depends','V'),c('largely','M'),c('on our attitude.','M')] },
  { id:'h3-5', level:'고3', text:"So absorbed was he in the novel that he didn't notice the time.", grammar:'보어 도치(So+형용사)', translation:'그는 소설에 너무 몰두해서 시간이 가는 줄도 몰랐다.',
    note:'원래 문장은 He was so absorbed in the novel that ~ 인데, So absorbed가 강조를 위해 앞으로 나가면서 주어와 동사가 도치되었어요.',
    chunks:[c('So absorbed','C'),c('was','V'),c('he','S'),c('in the novel','M'),c("that he didn't notice the time.",'M')] },
  { id:'h3-6', level:'고3', text:'What makes this discovery so remarkable is its potential to revolutionize medicine.', grammar:'명사절(what) 주어', translation:'이 발견을 그토록 놀랍게 만드는 것은 의학을 혁신할 잠재력이다.',
    chunks:[c('What makes this discovery so remarkable','S'),c('is','V'),c('its potential to revolutionize medicine.','C')] },
  { id:'h3-7', level:'고3', text:'Only when we accept our failures can we truly grow.', grammar:'부정어구(only when~) 도치', translation:'우리가 실패를 받아들일 때만 우리는 진정으로 성장할 수 있다.',
    chunks:[c('Only when we accept our failures','M'),c('can','V'),c('we','S'),c('truly','M'),c('grow.','V')] },
  { id:'h3-8', level:'고3', text:'The report suggests that companies investing in employee well-being tend to outperform their competitors.', grammar:'that절 목적어(명사절)', translation:'그 보고서는 직원 복지에 투자하는 기업들이 경쟁사보다 더 나은 성과를 내는 경향이 있다고 시사한다.',
    chunks:[c('The report','S'),c('suggests','V'),c('that companies investing in employee well-being tend to outperform their competitors.','O')] },
  { id:"h3-9", level:"고3", text:"It is often assumed that children who grow up bilingual develop stronger cognitive flexibility than their monolingual peers.", grammar:"가주어 It ~ that절 (수동태)", translation:"이중언어 환경에서 자란 아이들이 단일언어를 사용하는 또래보다 더 강한 인지적 유연성을 발달시킨다고 흔히 여겨진다.", note:"It은 가주어이며 that절이 진짜 주어이다.",
    chunks:[c("It","S"),c("is often assumed","V"),c("that children who grow up bilingual develop stronger cognitive flexibility than their monolingual peers.","M")] },
  { id:"h3-10", level:"고3", text:"The degree to which artificial intelligence will reshape the labor market remains highly uncertain among economists.", grammar:"전치사+관계대명사절이 이끄는 긴 주어", translation:"인공지능이 노동 시장을 어느 정도까지 재편할 것인지는 경제학자들 사이에서 여전히 매우 불확실하다.",
    chunks:[c("The degree to which artificial intelligence will reshape the labor market","S"),c("remains","V"),c("highly uncertain","C"),c("among economists.","M")] },
  { id:"h3-11", level:"고3", text:"Having been deprived of sleep for several consecutive nights, the participants struggled to concentrate during the experiment.", grammar:"완료 수동 분사구문", translation:"며칠 밤 연속으로 수면을 박탈당한 참가자들은 실험 도중 집중하는 데 어려움을 겪었다.",
    chunks:[c("Having been deprived of sleep for several consecutive nights,","M"),c("the participants","S"),c("struggled to concentrate","V"),c("during the experiment.","M")] },
  { id:"h3-12", level:"고3", text:"Whether governments can effectively regulate emerging biotechnologies will determine the pace of future medical innovation.", grammar:"명사절 주어 (Whether)", translation:"정부가 신흥 생명공학 기술을 효과적으로 규제할 수 있는지 여부가 미래 의학 혁신의 속도를 결정할 것이다.",
    chunks:[c("Whether governments can effectively regulate emerging biotechnologies","S"),c("will determine","V"),c("the pace of future medical innovation.","O")] },
  { id:"h3-13", level:"고3", text:"What distinguishes successful entrepreneurs from the rest is their willingness to embrace failure as a learning opportunity.", grammar:"명사절 주어 (What)", translation:"성공한 기업가들을 나머지 사람들과 구별짓는 것은 실패를 배움의 기회로 기꺼이 받아들이려는 의지이다.",
    chunks:[c("What distinguishes successful entrepreneurs from the rest","S"),c("is","V"),c("their willingness to embrace failure as a learning opportunity.","C")] },
  { id:"h3-14", level:"고3", text:"So devastating was the drought that entire communities were forced to abandon their farmland.", grammar:"보어 도치 (So+형용사+V+S ~ that절)", translation:"가뭄이 너무나 파괴적이어서 전체 지역사회가 농지를 버릴 수밖에 없었다.", note:"보어 So devastating이 문두로 나가면서 동사와 주어가 도치되었다.",
    chunks:[c("So devastating","C"),c("was","V"),c("the drought","S"),c("that entire communities were forced to abandon their farmland.","M")] },
  { id:"h3-15", level:"고3", text:"Not until researchers examined the data more closely did they realize the correlation was spurious.", grammar:"부정어구 도치 (Not until)", translation:"연구자들이 데이터를 더 자세히 조사하고 나서야 비로소 그들은 그 상관관계가 허위임을 깨달았다.", note:"부정어구 Not until절이 문두로 나가며 주어-동사 도치가 일어났다.",
    chunks:[c("Not until researchers examined the data more closely","M"),c("did","V"),c("they","S"),c("realize","V"),c("the correlation was spurious.","O")] },
  { id:"h3-16", level:"고3", text:"The study suggests that adolescents who spend excessive time on social media are more likely to report symptoms of anxiety and depression.", grammar:"that절 목적어 (긴 수식어 포함)", translation:"그 연구는 소셜 미디어에 지나치게 많은 시간을 소비하는 청소년들이 불안과 우울 증상을 보고할 가능성이 더 높다는 것을 시사한다.",
    chunks:[c("The study","S"),c("suggests","V"),c("that adolescents who spend excessive time on social media are more likely to report symptoms of anxiety and depression.","O")] },
  { id:"h3-17", level:"고3", text:"It has long been argued that economic growth alone cannot guarantee an improvement in overall quality of life.", grammar:"가주어 It ~ that절 (수동태)", translation:"경제 성장만으로는 전반적인 삶의 질 향상을 보장할 수 없다고 오랫동안 주장되어 왔다.", note:"It은 가주어이며 that절이 진짜 주어이다.",
    chunks:[c("It","S"),c("has long been argued","V"),c("that economic growth alone cannot guarantee an improvement in overall quality of life.","M")] },
  { id:"h3-18", level:"고3", text:"The speed at which glaciers are melting has alarmed scientists who monitor global climate patterns.", grammar:"전치사+관계대명사절이 이끄는 긴 주어", translation:"빙하가 녹는 속도가 전 지구적 기후 패턴을 관찰하는 과학자들을 놀라게 했다.",
    chunks:[c("The speed at which glaciers are melting","S"),c("has alarmed","V"),c("scientists who monitor global climate patterns.","O")] },
  { id:"h3-19", level:"고3", text:"Having been shaped by decades of political instability, the nation's institutions remain fragile and distrusted by citizens.", grammar:"완료 수동 분사구문", translation:"수십 년간의 정치적 불안정에 의해 형성되어 온 그 나라의 제도들은 여전히 취약하며 시민들의 불신을 받고 있다.",
    chunks:[c("Having been shaped by decades of political instability,","M"),c("the nation's institutions","S"),c("remain","V"),c("fragile and distrusted by citizens.","C")] },
  { id:"h3-20", level:"고3", text:"Whether artificial intelligence should be granted legal personhood remains a contentious topic among ethicists and lawmakers.", grammar:"명사절 주어 (Whether)", translation:"인공지능에게 법적 인격을 부여해야 하는지 여부는 윤리학자들과 입법자들 사이에서 여전히 논쟁적인 주제이다.",
    chunks:[c("Whether artificial intelligence should be granted legal personhood","S"),c("remains","V"),c("a contentious topic among ethicists and lawmakers.","C")] },
  { id:"h3-21", level:"고3", text:"Only after the pandemic subsided did policymakers begin to address the long-term economic damage it had caused.", grammar:"부정어구 도치 (Only after)", translation:"팬데믹이 진정된 후에야 비로소 정책 입안자들은 그것이 초래한 장기적인 경제적 피해를 다루기 시작했다.", note:"Only after절이 문두로 나가며 주어-동사 도치가 일어났다.",
    chunks:[c("Only after the pandemic subsided","M"),c("did","V"),c("policymakers","S"),c("begin","V"),c("to address the long-term economic damage it had caused.","O")] },
  { id:"h3-22", level:"고3", text:"Recent research indicates that individuals raised in bilingual households often outperform their peers on tasks requiring mental flexibility.", grammar:"that절 목적어 (긴 수식어 포함)", translation:"최근 연구는 이중언어 가정에서 자란 사람들이 정신적 유연성을 요구하는 과제에서 또래보다 흔히 더 뛰어난 성과를 낸다는 것을 보여준다.",
    chunks:[c("Recent research","S"),c("indicates","V"),c("that individuals raised in bilingual households often outperform their peers on tasks requiring mental flexibility.","O")] },
  { id:"h3-23", level:"고3", text:"It is generally acknowledged that early childhood experiences play a crucial role in shaping adult personality traits.", grammar:"가주어 It ~ that절 (수동태)", translation:"유아기의 경험이 성인의 성격 특성을 형성하는 데 중요한 역할을 한다는 것은 일반적으로 인정된다.", note:"It은 가주어이며 that절이 진짜 주어이다.",
    chunks:[c("It","S"),c("is generally acknowledged","V"),c("that early childhood experiences play a crucial role in shaping adult personality traits.","M")] },
  { id:"h3-24", level:"고3", text:"The extent to which social media algorithms influence political polarization has become a subject of intense academic debate.", grammar:"전치사+관계대명사절이 이끄는 긴 주어", translation:"소셜 미디어 알고리즘이 정치적 양극화에 영향을 미치는 정도는 치열한 학술적 논쟁의 주제가 되었다.",
    chunks:[c("The extent to which social media algorithms influence political polarization","S"),c("has become","V"),c("a subject of intense academic debate.","C")] },
  { id:"h3-25", level:"고3", text:"Rarely do consumers question the environmental cost of the products they purchase online.", grammar:"부정어구 도치 (Rarely)", translation:"소비자들은 온라인에서 구매하는 제품의 환경적 비용에 대해 좀처럼 의문을 제기하지 않는다.", note:"부정부사 Rarely가 문두로 나가며 주어-동사 도치가 일어났다.",
    chunks:[c("Rarely","M"),c("do","V"),c("consumers","S"),c("question","V"),c("the environmental cost of the products they purchase online.","O")] },
  { id:"h3-26", level:"고3", text:"Having been trained on massive datasets, the algorithm could predict consumer behavior with remarkable accuracy.", grammar:"완료 수동 분사구문", translation:"방대한 데이터셋으로 훈련된 그 알고리즘은 놀라운 정확도로 소비자 행동을 예측할 수 있었다.",
    chunks:[c("Having been trained on massive datasets,","M"),c("the algorithm","S"),c("could predict","V"),c("consumer behavior","O"),c("with remarkable accuracy.","M")] },
  { id:"h3-27", level:"고3", text:"What separates resilient societies from fragile ones is their capacity to adapt swiftly to unforeseen crises.", grammar:"명사절 주어 (What)", translation:"회복력 있는 사회를 취약한 사회와 구분 짓는 것은 예기치 못한 위기에 신속하게 적응하는 능력이다.",
    chunks:[c("What separates resilient societies from fragile ones","S"),c("is","V"),c("their capacity to adapt swiftly to unforeseen crises.","C")] },
  { id:"h3-28", level:"고3", text:"The survey reveals that employees working remotely tend to experience higher levels of job satisfaction despite reduced social interaction.", grammar:"that절 목적어 (긴 수식어 포함)", translation:"그 설문조사는 원격으로 근무하는 직원들이 사회적 상호작용이 줄어들었음에도 불구하고 더 높은 수준의 직무 만족도를 경험하는 경향이 있음을 보여준다.",
    chunks:[c("The survey","S"),c("reveals","V"),c("that employees working remotely tend to experience higher levels of job satisfaction despite reduced social interaction.","O")] },
  { id:"h3-29", level:"고3", text:"It is often claimed that children who begin learning a musical instrument before the age of seven display enhanced spatial reasoning abilities.", grammar:"가주어 It ~ that절(수동태)", translation:"일곱 살이 되기 전에 악기를 배우기 시작한 아이들은 향상된 공간 추론 능력을 보인다고 흔히 주장된다.", note:"It은 가주어이며, that절 전체가 진주어 역할을 하므로 하나의 M 묶음으로 처리",
    chunks:[c("It","S"),c("is often claimed","V"),c("that children who begin learning a musical instrument before the age of seven display enhanced spatial reasoning abilities.","M")] },
  { id:"h3-30", level:"고3", text:"It has been suggested that excessive exposure to blue light before bedtime disrupts the body's natural circadian rhythm.", grammar:"가주어 It ~ that절(수동태)", translation:"자기 전 블루라이트에 과도하게 노출되는 것은 신체의 자연스러운 생체 리듬을 방해한다고 제안되어 왔다.", note:"It은 가주어, that절이 진주어로서 전체를 M으로 묶음",
    chunks:[c("It","S"),c("has been suggested","V"),c("that excessive exposure to blue light before bedtime disrupts the body's natural circadian rhythm.","M")] },
  { id:"h3-31", level:"고3", text:"It is frequently argued that urban green spaces contribute significantly to residents' psychological well-being.", grammar:"가주어 It ~ that절(수동태)", translation:"도심의 녹지 공간은 주민들의 심리적 웰빙에 크게 기여한다고 흔히 주장된다.", note:"It은 가주어, that절이 진주어로서 전체를 M으로 묶음",
    chunks:[c("It","S"),c("is frequently argued","V"),c("that urban green spaces contribute significantly to residents' psychological well-being.","M")] },
  { id:"h3-32", level:"고3", text:"The manner in which a society treats its most vulnerable members often reveals its underlying values.", grammar:"전치사+관계대명사절이 포함된 긴 주어", translation:"한 사회가 가장 취약한 구성원들을 대하는 방식은 흔히 그 사회의 근본적인 가치를 드러낸다.", note:"전치사+관계대명사(in which)가 이끄는 수식어가 주어 전체를 길게 만들므로 하나의 S로 묶음",
    chunks:[c("The manner in which a society treats its most vulnerable members","S"),c("often","M"),c("reveals","V"),c("its underlying values.","O")] },
  { id:"h3-33", level:"고3", text:"The frequency with which consumers switch brands has increased dramatically in the age of online shopping.", grammar:"전치사+관계대명사절이 포함된 긴 주어", translation:"소비자들이 브랜드를 바꾸는 빈도는 온라인 쇼핑 시대에 급격히 증가했다.", note:"전치사+관계대명사(with which)절이 주어를 길게 구성하므로 하나의 S로 묶음",
    chunks:[c("The frequency with which consumers switch brands","S"),c("has increased","V"),c("dramatically","M"),c("in the age of online shopping.","M")] },
  { id:"h3-34", level:"고3", text:"The ease with which misinformation spreads online poses a serious threat to public discourse.", grammar:"전치사+관계대명사절이 포함된 긴 주어", translation:"온라인에서 잘못된 정보가 퍼지는 용이함은 공공 담론에 심각한 위협을 가한다.", note:"전치사+관계대명사(with which)절이 주어를 길게 구성하므로 하나의 S로 묶음",
    chunks:[c("The ease with which misinformation spreads online","S"),c("poses","V"),c("a serious threat to public discourse.","O")] },

/* ================= storage ================= */
const CUSTOM_KEY = 'chunkAppCustomSentences';
const STATS_KEY = 'chunkAppStats';
const LEVEL_KEY = 'chunkAppCurrentLevel';
const MODE_KEY = 'chunkAppPracticeMode';
const TRACKS = {
  chunk: { label: '🧩 구문 분석만', short: '구문 분석', hint: '문장을 하나씩 클릭한 뒤, 아래 태그 버튼으로 역할을 지정해보세요.' },
  chunk_translate: { label: '🧩📝 구문 + 해석 쓰기', short: '구문+해석', hint: '청크 태그를 모두 지정한 뒤, 문장 전체를 우리말로 해석해서 적어보세요.' },
};

function loadCustom() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch (e) { return []; }
}
function saveCustom(list) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { return {}; }
}
function saveStats(s) { localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
function getLevelStats(level) {
  const s = loadStats();
  return s[level] || { attempted: 0, correctSentences: 0, chunkTotal: 0, chunkCorrect: 0, translationAttempts: 0 };
}
function recordAttempt(level, chunkTotal, chunkCorrect, isTranslationTrack) {
  const s = loadStats();
  const cur = s[level] || { attempted: 0, correctSentences: 0, chunkTotal: 0, chunkCorrect: 0, translationAttempts: 0 };
  cur.attempted += 1;
  if (chunkCorrect === chunkTotal) cur.correctSentences += 1;
  cur.chunkTotal += chunkTotal;
  cur.chunkCorrect += chunkCorrect;
  if (isTranslationTrack) cur.translationAttempts = (cur.translationAttempts || 0) + 1;
  s[level] = cur;
  saveStats(s);
}

let customSentences = loadCustom();

function sentencesForLevel(level) {
  return SENTENCES.filter(s => s.level === level).concat(customSentences.filter(s => s.level === level));
}

/* ================= level state ================= */
let currentLevel = localStorage.getItem(LEVEL_KEY) || LEVELS[0];

function renderLevelRow() {
  const wrap = document.getElementById('levelRow');
  wrap.innerHTML = LEVELS.map(lv => {
    const total = sentencesForLevel(lv).length;
    const st = getLevelStats(lv);
    return `<button class="level-pill ${lv === currentLevel ? 'active' : ''}" data-level="${lv}">
      ${lv} <span class="prog">${st.attempted}/${total}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.level-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = btn.dataset.level;
      localStorage.setItem(LEVEL_KEY, currentLevel);
      practiceState = null;
      renderAll();
    });
  });
}

/* ================= legend ================= */
function legendHtml() {
  return TAGS.map(t => `<span class="legend-item tag-${t}">${t} · ${TAG_NAMES[t]}</span>`).join('');
}

/* ================= study tab ================= */
let openSentenceId = null;

function renderStudyTab() {
  document.getElementById('studyLevelTitle').textContent = currentLevel + ' 학습';
  document.getElementById('legendStudy').innerHTML = legendHtml();
  const list = sentencesForLevel(currentLevel);
  const wrap = document.getElementById('studyList');
  if (list.length === 0) {
    wrap.innerHTML = '<p class="empty-note">이 난이도에는 아직 문장이 없어요.</p>';
    return;
  }
  wrap.innerHTML = list.map(s => {
    const isOpen = openSentenceId === s.id;
    return `<div class="sentence-item ${isOpen ? 'open' : ''}" data-id="${s.id}">
      <div class="sent-text">${escapeHtml(s.text)}${s.custom ? '<span class="custom-badge">내 문장</span>' : ''}</div>
      <div class="sent-summary">${s.grammar ? escapeHtml(s.grammar) : ''}</div>
      ${isOpen ? renderChunkDisplay(s) : ''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('.sentence-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      openSentenceId = openSentenceId === id ? null : id;
      renderStudyTab();
    });
  });
}

function renderChunkDisplay(s) {
  const chunksHtml = s.chunks.map(ch => `
    <div class="chunk-box">
      <span class="chunk-word tag-${ch.g}">${escapeHtml(ch.t)}</span>
      <span class="chunk-label tag-${ch.g}">${ch.g}</span>
    </div>`).join('');
  return `
    <div class="chunk-line">${chunksHtml}</div>
    ${s.translation ? `<div class="sent-meta">🇰🇷 ${escapeHtml(s.translation)}</div>` : ''}
    ${s.note ? `<div class="sent-note">💡 ${escapeHtml(s.note)}</div>` : ''}
  `;
}

/* ================= practice tab ================= */
let practiceMode = localStorage.getItem(MODE_KEY) || 'chunk'; // 'chunk' | 'chunk_translate'
let practiceState = null; // {sentence, assigned:{idx:tag}, graded:bool, selectedIdx, userTranslation}
let practiceOrderPerLevel = {}; // level -> shuffled list of sentence ids, and cursor

function renderTrackRow() {
  const wrap = document.getElementById('trackRow');
  wrap.innerHTML = Object.keys(TRACKS).map(key =>
    `<button class="track-pill ${key === practiceMode ? 'active' : ''}" data-track="${key}">${TRACKS[key].label}</button>`
  ).join('');
  wrap.querySelectorAll('.track-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.track === practiceMode) return;
      practiceMode = btn.dataset.track;
      localStorage.setItem(MODE_KEY, practiceMode);
      if (practiceState) {
        practiceState.assigned = {};
        practiceState.selectedIdx = null;
        practiceState.graded = false;
        practiceState.userTranslation = '';
      }
      renderTrackRow();
      renderPracticeTab();
    });
  });
}

function getPracticeQueue(level) {
  if (!practiceOrderPerLevel[level]) {
    const ids = shuffle(sentencesForLevel(level).map(s => s.id));
    practiceOrderPerLevel[level] = { ids, cursor: 0 };
  }
  return practiceOrderPerLevel[level];
}

function startPractice(level, sentenceId) {
  const s = sentencesForLevel(level).find(x => x.id === sentenceId);
  if (!s) return;
  practiceState = { sentence: s, assigned: {}, graded: false, selectedIdx: null, userTranslation: '' };
}

function nextPracticeSentence() {
  const q = getPracticeQueue(currentLevel);
  const list = sentencesForLevel(currentLevel);
  if (list.length === 0) { practiceState = null; return; }
  q.cursor = (q.cursor + 1) % q.ids.length;
  startPractice(currentLevel, q.ids[q.cursor]);
}

function isGradeReady() {
  if (!practiceState) return false;
  const s = practiceState.sentence;
  const allAssigned = s.chunks.every((_, i) => practiceState.assigned[i]);
  if (!allAssigned) return false;
  if (practiceMode === 'chunk_translate' && !(practiceState.userTranslation || '').trim()) return false;
  return true;
}

function updateGradeButtonState() {
  const gradeBtn = document.getElementById('gradeBtn');
  if (!gradeBtn || !practiceState) return;
  gradeBtn.disabled = practiceState.graded || !isGradeReady();
}

function renderPracticeTab() {
  document.getElementById('legendPractice').innerHTML = legendHtml();
  const list = sentencesForLevel(currentLevel);
  const st = getLevelStats(currentLevel);
  document.getElementById('practiceProgress').textContent =
    `${currentLevel} · ${TRACKS[practiceMode].short} 트랙 · 지금까지 ${st.attempted}문장 연습, 문장 완벽정답 ${st.correctSentences}개 / 청크 정확도 ${st.chunkTotal ? Math.round(st.chunkCorrect / st.chunkTotal * 100) : 0}%`;

  const area = document.getElementById('practiceArea');
  if (list.length === 0) {
    area.innerHTML = '<p class="empty-note">이 난이도에는 아직 연습할 문장이 없어요.</p>';
    return;
  }
  if (!practiceState || practiceState.sentence.level !== currentLevel) {
    const q = getPracticeQueue(currentLevel);
    startPractice(currentLevel, q.ids[q.cursor % q.ids.length]);
  }

  const s = practiceState.sentence;
  const chunksHtml = s.chunks.map((ch, i) => {
    const assignedTag = practiceState.assigned[i];
    let cls = 'pchunk';
    if (practiceState.selectedIdx === i) cls += ' selected';
    if (practiceState.graded) {
      cls += (assignedTag === ch.g) ? ' graded-correct' : ' graded-wrong';
    }
    const badge = assignedTag ? `<span class="assigned-tag tag-${assignedTag}">${assignedTag}</span>` : '';
    const wrongNote = (practiceState.graded && assignedTag !== ch.g)
      ? `<span class="mark no">정답: ${ch.g}</span>` : (practiceState.graded ? `<span class="mark ok">✓</span>` : '');
    return `<span class="pchunk-wrap" style="display:inline-flex;align-items:center;gap:4px;">
      <span class="${cls}" data-idx="${i}">${escapeHtml(ch.t)}${badge}</span>${wrongNote}
    </span>`;
  }).join(' ');

  const translateBlockHtml = practiceMode === 'chunk_translate' ? `
    <div class="translate-block">
      <label for="userTranslationInput">📝 이 문장을 우리말로 해석해 보세요</label>
      <textarea id="userTranslationInput" placeholder="예: 나는 학생이다." ${practiceState.graded ? 'disabled' : ''}>${escapeHtml(practiceState.userTranslation || '')}</textarea>
    </div>
  ` : '';

  area.innerHTML = `
    <div class="practice-sentence-src">${TRACKS[practiceMode].hint}</div>
    <div class="chunk-line" id="pchunkLine">${chunksHtml}</div>
    <div class="tag-picker" id="tagPicker">
      ${TAGS.map(t => `<button class="tag-btn tag-btn-${t}" data-tag="${t}" ${practiceState.graded ? 'disabled' : ''}>${t} (${TAG_NAMES[t]})</button>`).join('')}
    </div>
    ${translateBlockHtml}
    <div class="btn-row">
      <button class="btn primary" id="gradeBtn" ${(!isGradeReady() || practiceState.graded) ? 'disabled' : ''}>채점하기</button>
      <button class="btn" id="resetBtn" ${practiceState.graded ? 'disabled' : ''}>다시 선택</button>
      <button class="btn" id="nextBtn">다음 문장 →</button>
    </div>
    <div id="resultBox"></div>
  `;

  area.querySelectorAll('.pchunk').forEach(el => {
    el.addEventListener('click', () => {
      if (practiceState.graded) return;
      practiceState.selectedIdx = Number(el.dataset.idx);
      renderPracticeTab();
    });
  });
  area.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (practiceState.selectedIdx === null || practiceState.graded) return;
      practiceState.assigned[practiceState.selectedIdx] = btn.dataset.tag;
      practiceState.selectedIdx = null;
      renderPracticeTab();
    });
  });
  const translationInput = document.getElementById('userTranslationInput');
  if (translationInput) {
    translationInput.addEventListener('input', () => {
      practiceState.userTranslation = translationInput.value;
      updateGradeButtonState();
    });
  }
  const gradeBtn = document.getElementById('gradeBtn');
  if (gradeBtn) gradeBtn.addEventListener('click', gradePractice);
  document.getElementById('resetBtn').addEventListener('click', () => {
    practiceState.assigned = {};
    practiceState.selectedIdx = null;
    practiceState.userTranslation = '';
    renderPracticeTab();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    nextPracticeSentence();
    renderPracticeTab();
  });

  if (practiceState.graded) renderResultBox();
}

function gradePractice() {
  if (!isGradeReady()) return;
  practiceState.graded = true;
  const s = practiceState.sentence;
  const total = s.chunks.length;
  const correct = s.chunks.filter((ch, i) => practiceState.assigned[i] === ch.g).length;
  recordAttempt(currentLevel, total, correct, practiceMode === 'chunk_translate');
  renderLevelRow();
  renderPracticeTab();
}

function renderResultBox() {
  const s = practiceState.sentence;
  const total = s.chunks.length;
  const correct = s.chunks.filter((ch, i) => practiceState.assigned[i] === ch.g).length;
  const perfect = correct === total;
  const box = document.getElementById('resultBox');
  const compareHtml = practiceMode === 'chunk_translate' ? `
    <div class="compare-block">
      <div class="compare-row mine"><span class="compare-lbl">📝 내가 쓴 해석</span>${escapeHtml(practiceState.userTranslation || '(입력 없음)')}</div>
      <div class="compare-row model"><span class="compare-lbl">✅ 모범 해석</span>${s.translation ? escapeHtml(s.translation) : '(모범 해석 없음)'}</div>
    </div>
  ` : (s.translation ? `<div class="sent-meta">🇰🇷 ${escapeHtml(s.translation)}</div>` : '');
  box.innerHTML = `
    <div class="result-box ${perfect ? '' : 'bad'}">
      <strong>${perfect ? '🎉 청크 완벽해요!' : `청크 ${correct} / ${total} 개 정답`}</strong>
      ${compareHtml}
      ${s.note ? `<div class="sent-note">💡 ${escapeHtml(s.note)}</div>` : ''}
    </div>
  `;
}

/* ================= add tab ================= */
let addChunkDraft = [];

function renderAddLevelSelect() {
  const sel = document.getElementById('addLevel');
  sel.innerHTML = LEVELS.map(lv => `<option value="${lv}" ${lv === currentLevel ? 'selected' : ''}>${lv}</option>`).join('');
}

document.getElementById('addParseBtn').addEventListener('click', () => {
  const raw = document.getElementById('addChunksRaw').value;
  const parts = raw.split('/').map(p => p.trim()).filter(Boolean);
  if (parts.length === 0) { alert('청크를 하나 이상 입력해주세요.'); return; }
  addChunkDraft = parts.map(p => ({ t: p, g: 'S' }));
  renderAddChunkTagArea();
});

function renderAddChunkTagArea() {
  const wrap = document.getElementById('addChunkTagArea');
  if (addChunkDraft.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <h3>각 청크의 역할을 선택하세요</h3>
    <div class="custom-chunk-preview">
      ${addChunkDraft.map((d, i) => `
        <span class="chunk-box">
          <span class="chunk-word tag-${d.g}">${escapeHtml(d.t)}</span>
          <select data-idx="${i}" class="chunkTagSelect" style="font-size:11px; padding:2px 4px;">
            ${TAGS.map(t => `<option value="${t}" ${t === d.g ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </span>
      `).join('')}
    </div>
  `;
  wrap.querySelectorAll('.chunkTagSelect').forEach(sel => {
    sel.addEventListener('change', () => {
      addChunkDraft[Number(sel.dataset.idx)].g = sel.value;
      renderAddChunkTagArea();
    });
  });
}

document.getElementById('addSaveBtn').addEventListener('click', () => {
  if (addChunkDraft.length === 0) { alert('먼저 "청크 나누기" 버튼으로 문장을 나눠주세요.'); return; }
  const level = document.getElementById('addLevel').value;
  const grammar = document.getElementById('addGrammar').value.trim();
  const translation = document.getElementById('addTranslation').value.trim();
  const text = addChunkDraft.map(d => d.t).join(' ');
  const sentence = {
    id: 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    level, text, grammar, translation,
    chunks: addChunkDraft.map(d => ({ t: d.t, g: d.g })),
    custom: true
  };
  customSentences.push(sentence);
  saveCustom(customSentences);
  addChunkDraft = [];
  document.getElementById('addChunksRaw').value = '';
  document.getElementById('addChunkTagArea').innerHTML = '';
  document.getElementById('addGrammar').value = '';
  document.getElementById('addTranslation').value = '';
  alert('문장이 저장되었어요!');
  practiceOrderPerLevel[level] = null;
  renderAll();
});

function renderCustomList() {
  const wrap = document.getElementById('customList');
  if (customSentences.length === 0) {
    wrap.innerHTML = '<p class="empty-note">아직 추가한 문장이 없어요.</p>';
    return;
  }
  wrap.innerHTML = customSentences.map(s => `
    <div class="sentence-item">
      <div class="sent-text">[${s.level}] ${escapeHtml(s.text)}</div>
      <div class="sent-summary">${s.grammar ? escapeHtml(s.grammar) : ''}</div>
      <div class="btn-row">
        <button class="btn small danger" data-id="${s.id}">삭제</button>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('이 문장을 삭제할까요?')) return;
      customSentences = customSentences.filter(s => s.id !== btn.dataset.id);
      saveCustom(customSentences);
      practiceOrderPerLevel = {};
      renderAll();
    });
  });
}

/* ================= stats tab ================= */
function renderStatsTab() {
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = LEVELS.map(lv => {
    const st = getLevelStats(lv);
    const total = sentencesForLevel(lv).length;
    const acc = st.chunkTotal ? Math.round(st.chunkCorrect / st.chunkTotal * 100) : 0;
    return `
      <h3>${lv}</h3>
      <div class="stats-grid">
        <div class="stat-cell"><div class="num">${total}</div><div class="lbl">전체 문장</div></div>
        <div class="stat-cell"><div class="num">${st.attempted}</div><div class="lbl">연습 횟수</div></div>
        <div class="stat-cell"><div class="num">${st.correctSentences}</div><div class="lbl">완벽 정답</div></div>
        <div class="stat-cell"><div class="num">${acc}%</div><div class="lbl">청크 정확도</div></div>
        <div class="stat-cell"><div class="num">${st.translationAttempts || 0}</div><div class="lbl">해석 연습 횟수</div></div>
      </div>
    `;
  }).join('');
}

document.getElementById('resetStatsBtn').addEventListener('click', () => {
  if (!confirm('모든 학습 기록을 초기화할까요? 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(STATS_KEY);
  renderAll();
});

/* ================= tabs ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    renderAll();
  });
});

/* ================= utils ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* ================= init ================= */
function renderAll() {
  renderLevelRow();
  renderTrackRow();
  renderStudyTab();
  renderPracticeTab();
  renderAddLevelSelect();
  renderCustomList();
  renderStatsTab();
}
renderAll();
</script>
</body>
</html>
