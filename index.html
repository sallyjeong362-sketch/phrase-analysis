<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 문장 끊어읽기 &amp; 청크 분석 연습</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; color: #2c2c2a; }
.app { max-width: 860px; width: 100%; }
h1 { font-size: 21px; font-weight: 600; color: #1a1a18; margin-bottom: 0.25rem; }
.subtitle { font-size: 14px; color: #888; margin-bottom: 1.25rem; }

.tabs { display: flex; gap: 6px; margin-bottom: 1.1rem; border-bottom: 1px solid #e8e8e6; }
.tab-btn { background: transparent; border: none; padding: 0.65rem 0.9rem; font-size: 14px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn:hover { color: #185FA5; }
.tab-btn.active { color: #185FA5; border-bottom-color: #185FA5; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.card { background: #fff; border: 1px solid #e8e8e6; border-radius: 14px; padding: 1.25rem 1.4rem; margin-bottom: 1.25rem; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 0.75rem; color: #1a1a18; }
.card h3 { font-size: 13px; font-weight: 600; margin: 1rem 0 0.5rem; color: #444; }
.hint { font-size: 12.5px; color: #999; line-height: 1.6; margin-bottom: 0.75rem; }
.hint code { background: #f0f0ee; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

label { display: block; font-size: 12.5px; color: #666; margin-bottom: 4px; font-weight: 500; }
input[type=text], textarea, select {
  width: 100%; border: 1px solid #dcdcd8; border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 14px; font-family: inherit; background: #fafaf8; color: #1a1a18;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: #185FA5; background: #fff; }
textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.field { margin-bottom: 0.85rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.btn { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 0.6rem 1.1rem; font-size: 13.5px; cursor: pointer; color: #444; font-weight: 500; }
.btn:hover { background: #f0f0ee; }
.btn.primary { background: #185FA5; color: #fff; border-color: transparent; }
.btn.primary:hover { background: #0c447c; }
.btn.danger { color: #b33; border-color: #eecccc; }
.btn.danger:hover { background: #fdf0f0; }
.btn.small { padding: 0.35rem 0.7rem; font-size: 12.5px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; align-items: center; }

/* level pills */
.level-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.1rem; }
.level-pill { background: #fff; border: 1px solid #dcdcd8; border-radius: 999px; padding: 0.45rem 0.95rem; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.level-pill:hover { border-color: #185FA5; color: #185FA5; }
.level-pill.active { background: #185FA5; border-color: #185FA5; color: #fff; }
.level-pill .prog { font-size: 10.5px; font-weight: 500; opacity: 0.85; }

/* tag colors */
.tag-S { background: #eaf1fb; color: #185FA5; border: 1px solid #b9d3f0; }
.tag-V { background: #fdecec; color: #c0392b; border: 1px solid #f3c2c2; }
.tag-O { background: #eaf7ee; color: #1e8449; border: 1px solid #bfe6cc; }
.tag-C { background: #f3ecfb; color: #7d3c98; border: 1px solid #d9c2ef; }
.tag-M { background: #fdf3e3; color: #b9770e; border: 1px solid #f2ddb0; }

.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 0.9rem; font-size: 12.5px; }
.legend-item { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }

/* sentence chunk display */
.chunk-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 0.9rem 0 0.35rem; }
.chunk-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chunk-word { border-radius: 8px; padding: 0.4rem 0.65rem; font-size: 15px; font-weight: 500; line-height: 1.3; }
.chunk-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 999px; }
.sent-meta { font-size: 12.5px; color: #888; margin-top: 0.4rem; }
.sent-grammar { display: inline-block; background: #f0f0ee; color: #555; border-radius: 6px; padding: 1px 8px; font-size: 11.5px; margin-right: 6px; }
.sent-note { font-size: 12px; color: #a67c00; background: #fffaf0; border: 1px solid #f2e2b8; border-radius: 8px; padding: 0.5rem 0.7rem; margin-top: 0.5rem; line-height: 1.55; }

/* study list */
.sentence-item { border: 1px solid #e8e8e6; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 10px; cursor: pointer; }
.sentence-item:hover { border-color: #185FA5; }
.sentence-item.open { border-color: #185FA5; background: #fafcff; }
.sentence-item .sent-text { font-size: 14.5px; font-weight: 500; color: #1a1a18; }
.sentence-item .sent-summary { font-size: 12px; color: #999; margin-top: 3px; }
.custom-badge { background: #185FA5; color: #fff; border-radius: 5px; padding: 0 6px; font-size: 10.5px; margin-left: 6px; }

/* practice */
.practice-progress { font-size: 12.5px; color: #888; margin-bottom: 0.5rem; }
.practice-sentence-src { font-size: 13px; color: #aaa; margin-bottom: 0.6rem; }
.pchunk { border: 2px solid #ddd; border-radius: 8px; padding: 0.4rem 0.65rem; font-size: 15px; font-weight: 500; cursor: pointer; background: #fafaf8; color: #333; position: relative; }
.pchunk.selected { border-color: #185FA5; box-shadow: 0 0 0 2px #d6e6f7; }
.pchunk .assigned-tag { position: absolute; top: -10px; right: -6px; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 0px 5px; }
.pchunk.graded-correct { border-color: #1e8449; }
.pchunk.graded-wrong { border-color: #c0392b; }
.mark { font-size: 13px; font-weight: 800; margin-left: 4px; }
.mark.ok { color: #1e8449; }
.mark.no { color: #c0392b; }

.tag-picker { display: flex; gap: 8px; margin: 1rem 0; flex-wrap: wrap; }
.tag-btn { border: none; border-radius: 8px; padding: 0.55rem 1.2rem; font-size: 14px; font-weight: 700; cursor: pointer; }
.tag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.tag-btn-S { background: #eaf1fb; color: #185FA5; }
.tag-btn-V { background: #fdecec; color: #c0392b; }
.tag-btn-O { background: #eaf7ee; color: #1e8449; }
.tag-btn-C { background: #f3ecfb; color: #7d3c98; }
.tag-btn-M { background: #fdf3e3; color: #b9770e; }
.tag-btn:hover:not(:disabled) { filter: brightness(0.95); }

.result-box { margin-top: 1rem; padding: 0.85rem 1rem; border-radius: 10px; background: #f7faf7; border: 1px solid #dceedd; font-size: 14px; }
.result-box.bad { background: #fdf5f5; border-color: #f2d6d6; }
.wrong-list { font-size: 12.5px; color: #666; margin-top: 6px; line-height: 1.8; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat-cell { background: #fafaf8; border: 1px solid #eee; border-radius: 10px; padding: 0.6rem 0.75rem; text-align: center; }
.stat-cell .num { font-size: 17px; font-weight: 700; color: #185FA5; }
.stat-cell .lbl { font-size: 11px; color: #999; margin-top: 2px; }

.custom-chunk-preview { display: flex; gap: 6px; flex-wrap: wrap; margin: 0.5rem 0; }
.empty-note { color: #bbb; font-size: 12.5px; }
@media (max-width: 560px) {
  .row2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <h1>🧩 영어 문장 끊어읽기 연습</h1>
  <p class="subtitle">문장을 주어(S) · 동사(V) · 목적어(O) · 보어(C) · 수식어(M) 덩어리로 나누어 보고, 직접 표시하며 연습해요</p>

  <div class="level-row" id="levelRow"></div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="study">📖 학습</button>
    <button class="tab-btn" data-tab="practice">✍️ 연습 문제</button>
    <button class="tab-btn" data-tab="add">➕ 문장 추가</button>
    <button class="tab-btn" data-tab="stats">📊 학습 현황</button>
  </nav>

  <!-- 학습 탭 -->
  <section id="tab-study" class="tab-panel active">
    <div class="card">
      <h2 id="studyLevelTitle">학습</h2>
      <div class="legend" id="legendStudy"></div>
      <div id="studyList"></div>
    </div>
  </section>

  <!-- 연습 탭 -->
  <section id="tab-practice" class="tab-panel">
    <div class="card">
      <h2>청크 분석 연습</h2>
      <div class="legend" id="legendPractice"></div>
      <div class="practice-progress" id="practiceProgress"></div>
      <div id="practiceArea"></div>
    </div>
  </section>

  <!-- 문장 추가 탭 -->
  <section id="tab-add" class="tab-panel">
    <div class="card">
      <h2>내 문장 추가하기</h2>
      <p class="hint">
        문장을 원하는 청크 단위로 <code>/</code> 로 구분해서 입력하면, 각 청크에 태그(S/V/O/C/M)를 지정할 수 있어요.<br>
        예: <code>She / gave / me / a nice present.</code>
      </p>
      <div class="field">
        <label>난이도</label>
        <select id="addLevel"></select>
      </div>
      <div class="field">
        <label>문법 포인트 (선택)</label>
        <input type="text" id="addGrammar" placeholder="예: 3형식 문장">
      </div>
      <div class="field">
        <label>청크 구분 입력 (/ 로 구분)</label>
        <textarea id="addChunksRaw" placeholder="예: She / gave / me / a nice present."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn" id="addParseBtn">청크 나누기</button>
      </div>
      <div id="addChunkTagArea"></div>
      <div class="field" style="margin-top:0.75rem;">
        <label>한글 해석 (선택)</label>
        <input type="text" id="addTranslation" placeholder="예: 그녀는 나에게 멋진 선물을 주었다.">
      </div>
      <div class="btn-row">
        <button class="btn primary" id="addSaveBtn">이 문장 저장하기</button>
      </div>
    </div>

    <div class="card">
      <h2>내가 추가한 문장</h2>
      <div id="customList"></div>
    </div>
  </section>

  <!-- 학습 현황 탭 -->
  <section id="tab-stats" class="tab-panel">
    <div class="card">
      <h2>난이도별 학습 현황</h2>
      <div id="statsWrap"></div>
      <div class="btn-row" style="margin-top:1rem;">
        <button class="btn danger" id="resetStatsBtn">🗑️ 기록 초기화</button>
      </div>
    </div>
  </section>
</div>

<script>
/* ================= data ================= */
const LEVELS = ['중1', '중2', '중3', '고1', '고2', '고3'];
const TAGS = ['S', 'V', 'O', 'C', 'M'];
const TAG_NAMES = { S: '주어', V: '동사', O: '목적어', C: '보어', M: '수식어' };

function c(t, g) { return { t, g }; }

const SENTENCES = [
  // ---------------- 중1 ----------------
  { id:'m1-1', level:'중1', text:'I am a student.', grammar:'2형식 (be동사+보어)', translation:'나는 학생이다.',
    chunks:[c('I','S'),c('am','V'),c('a student.','C')] },
  { id:'m1-2', level:'중1', text:'She likes cats.', grammar:'3형식', translation:'그녀는 고양이를 좋아한다.',
    chunks:[c('She','S'),c('likes','V'),c('cats.','O')] },
  { id:'m1-3', level:'중1', text:'We play soccer after school.', grammar:'3형식 + 시간 수식어', translation:'우리는 방과 후에 축구를 한다.',
    chunks:[c('We','S'),c('play','V'),c('soccer','O'),c('after school.','M')] },
  { id:'m1-4', level:'중1', text:'The weather is nice today.', grammar:'2형식 + 시간 부사', translation:'오늘 날씨가 좋다.',
    chunks:[c('The weather','S'),c('is','V'),c('nice','C'),c('today.','M')] },
  { id:'m1-5', level:'중1', text:'He runs fast every morning.', grammar:'1형식 + 부사 수식어', translation:'그는 매일 아침 빠르게 달린다.',
    chunks:[c('He','S'),c('runs','V'),c('fast','M'),c('every morning.','M')] },
  { id:'m1-6', level:'중1', text:'My brother is very tall.', grammar:'2형식', translation:'내 형[남동생]은 키가 매우 크다.',
    chunks:[c('My brother','S'),c('is','V'),c('very tall.','C')] },
  { id:'m1-7', level:'중1', text:'They watch TV in the evening.', grammar:'3형식 + 장소/시간 수식어', translation:'그들은 저녁에 TV를 본다.',
    chunks:[c('They','S'),c('watch','V'),c('TV','O'),c('in the evening.','M')] },
  { id:'m1-8', level:'중1', text:'I go to school by bus.', grammar:'1형식 + 전치사구 수식어', translation:'나는 버스를 타고 학교에 간다.',
    chunks:[c('I','S'),c('go','V'),c('to school','M'),c('by bus.','M')] },
  { id:'m1-9', level:'중1', text:'There are many books on the desk.', grammar:'there is/are 구문', translation:'책상 위에 책이 많이 있다.',
    note:'There는 뜻이 없는 유도부사예요. 진짜 주어는 그 뒤에 나오는 many books예요.',
    chunks:[c('There','M'),c('are','V'),c('many books','S'),c('on the desk.','M')] },
  { id:'m1-10', level:'중1', text:'She gave her friend a nice present.', grammar:'4형식 (수여동사)', translation:'그녀는 친구에게 멋진 선물을 주었다.',
    note:'수여동사 문장은 목적어가 두 개예요. (간접목적어: her friend, 직접목적어: a nice present)',
    chunks:[c('She','S'),c('gave','V'),c('her friend','O'),c('a nice present.','O')] },
  { id:"m1-11", level:"중1", text:"My mother cooks dinner every evening.", grammar:"3형식 문장 (S+V+O) + 시간 수식어", translation:"나의 어머니는 매일 저녁 식사를 요리하신다.",
    chunks:[c("My mother","S"),c("cooks","V"),c("dinner","O"),c("every evening.","M")] },
  { id:"m1-12", level:"중1", text:"The children play in the park.", grammar:"1형식 문장 (S+V) + 장소 수식어", translation:"아이들은 공원에서 논다.",
    chunks:[c("The children","S"),c("play","V"),c("in the park.","M")] },
  { id:"m1-13", level:"중1", text:"Her new bag is red.", grammar:"2형식 문장 (be동사 + 형용사 보어)", translation:"그녀의 새 가방은 빨간색이다.",
    chunks:[c("Her new bag","S"),c("is","V"),c("red.","C")] },
  { id:"m1-14", level:"중1", text:"I often visit my grandmother.", grammar:"3형식 문장 + 빈도부사", translation:"나는 종종 할머니를 방문한다.",
    chunks:[c("I","S"),c("often","M"),c("visit","V"),c("my grandmother.","O")] },
  { id:"m1-15", level:"중1", text:"There is a cat under the table.", grammar:"There is 구문 (2형식 변형)", translation:"탁자 아래에 고양이가 있다.", note:"There is/are 구문에서 There는 수식어(M)로, is/are 뒤에 오는 명사가 진짜 주어(S)예요.",
    chunks:[c("There","M"),c("is","V"),c("a cat","S"),c("under the table.","M")] },
  { id:"m1-16", level:"중1", text:"My father gave me a new bicycle.", grammar:"4형식 문장 (수여동사 gave)", translation:"아버지는 나에게 새 자전거를 주셨다.", note:"gave 뒤에 사람(간접목적어)과 사물(직접목적어) 두 개의 목적어가 와요.",
    chunks:[c("My father","S"),c("gave","V"),c("me","O"),c("a new bicycle.","O")] },
  { id:"m1-17", level:"중1", text:"The soup smells delicious.", grammar:"2형식 문장 (감각동사 smell + 형용사 보어)", translation:"그 수프는 맛있는 냄새가 난다.",
    chunks:[c("The soup","S"),c("smells","V"),c("delicious.","C")] },
  { id:"m1-18", level:"중1", text:"We usually eat breakfast at seven.", grammar:"3형식 문장 + 빈도부사 + 시간 수식어", translation:"우리는 보통 7시에 아침을 먹는다.",
    chunks:[c("We","S"),c("usually","M"),c("eat","V"),c("breakfast","O"),c("at seven.","M")] },
  { id:"m1-19", level:"중1", text:"My sister became a doctor last year.", grammar:"2형식 문장 (become + 명사 보어)", translation:"나의 언니는 작년에 의사가 되었다.", note:"become 뒤에는 명사나 형용사가 보어(C)로 와서 주어의 상태 변화를 나타내요.",
    chunks:[c("My sister","S"),c("became","V"),c("a doctor","C"),c("last year.","M")] },
  { id:"m1-20", level:"중1", text:"The students study English in the library.", grammar:"3형식 문장 + 장소 수식어", translation:"학생들은 도서관에서 영어를 공부한다.",
    chunks:[c("The students","S"),c("study","V"),c("English","O"),c("in the library.","M")] },
  { id:"m1-21", level:"중1", text:"There are two dogs in the yard.", grammar:"There are 구문 (복수 주어)", translation:"마당에 개 두 마리가 있다.",
    chunks:[c("There","M"),c("are","V"),c("two dogs","S"),c("in the yard.","M")] },
  { id:"m1-22", level:"중1", text:"My uncle sent me a letter.", grammar:"4형식 문장 (수여동사 sent)", translation:"삼촌은 나에게 편지를 보내셨다.",
    chunks:[c("My uncle","S"),c("sent","V"),c("me","O"),c("a letter.","O")] },
  { id:"m1-23", level:"중1", text:"The music sounds wonderful.", grammar:"2형식 문장 (감각동사 sound + 형용사 보어)", translation:"그 음악은 멋지게 들린다.",
    chunks:[c("The music","S"),c("sounds","V"),c("wonderful.","C")] },
  { id:"m1-24", level:"중1", text:"I sometimes lose my umbrella.", grammar:"3형식 문장 + 빈도부사", translation:"나는 가끔 우산을 잃어버린다.",
    chunks:[c("I","S"),c("sometimes","M"),c("lose","V"),c("my umbrella.","O")] },
  { id:"m1-25", level:"중1", text:"Her voice is very sweet.", grammar:"2형식 문장 (be동사 + 형용사 보어)", translation:"그녀의 목소리는 매우 부드럽다.",
    chunks:[c("Her voice","S"),c("is","V"),c("very sweet.","C")] },
  { id:"m1-26", level:"중1", text:"The boys swim in the river every summer.", grammar:"1형식 문장 + 장소 수식어 + 시간 수식어", translation:"그 소년들은 매년 여름 강에서 수영한다.",
    chunks:[c("The boys","S"),c("swim","V"),c("in the river","M"),c("every summer.","M")] },
  { id:"m1-27", level:"중1", text:"My aunt teaches us math.", grammar:"4형식 문장 (수여동사 teach)", translation:"이모는 우리에게 수학을 가르치신다.",
    chunks:[c("My aunt","S"),c("teaches","V"),c("us","O"),c("math.","O")] },

/* ================= storage ================= */
const CUSTOM_KEY = 'chunkAppCustomSentences';
const STATS_KEY = 'chunkAppStats';
const LEVEL_KEY = 'chunkAppCurrentLevel';

function loadCustom() {
  try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; } catch (e) { return []; }
}
function saveCustom(list) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { return {}; }
}
function saveStats(s) { localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
function getLevelStats(level) {
  const s = loadStats();
  return s[level] || { attempted: 0, correctSentences: 0, chunkTotal: 0, chunkCorrect: 0 };
}
function recordAttempt(level, chunkTotal, chunkCorrect) {
  const s = loadStats();
  const cur = s[level] || { attempted: 0, correctSentences: 0, chunkTotal: 0, chunkCorrect: 0 };
  cur.attempted += 1;
  if (chunkCorrect === chunkTotal) cur.correctSentences += 1;
  cur.chunkTotal += chunkTotal;
  cur.chunkCorrect += chunkCorrect;
  s[level] = cur;
  saveStats(s);
}

let customSentences = loadCustom();

function sentencesForLevel(level) {
  return SENTENCES.filter(s => s.level === level).concat(customSentences.filter(s => s.level === level));
}

/* ================= level state ================= */
let currentLevel = localStorage.getItem(LEVEL_KEY) || LEVELS[0];

function renderLevelRow() {
  const wrap = document.getElementById('levelRow');
  wrap.innerHTML = LEVELS.map(lv => {
    const total = sentencesForLevel(lv).length;
    const st = getLevelStats(lv);
    return `<button class="level-pill ${lv === currentLevel ? 'active' : ''}" data-level="${lv}">
      ${lv} <span class="prog">${st.attempted}/${total}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.level-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLevel = btn.dataset.level;
      localStorage.setItem(LEVEL_KEY, currentLevel);
      practiceState = null;
      renderAll();
    });
  });
}

/* ================= legend ================= */
function legendHtml() {
  return TAGS.map(t => `<span class="legend-item tag-${t}">${t} · ${TAG_NAMES[t]}</span>`).join('');
}

/* ================= study tab ================= */
let openSentenceId = null;

function renderStudyTab() {
  document.getElementById('studyLevelTitle').textContent = currentLevel + ' 학습';
  document.getElementById('legendStudy').innerHTML = legendHtml();
  const list = sentencesForLevel(currentLevel);
  const wrap = document.getElementById('studyList');
  if (list.length === 0) {
    wrap.innerHTML = '<p class="empty-note">이 난이도에는 아직 문장이 없어요.</p>';
    return;
  }
  wrap.innerHTML = list.map(s => {
    const isOpen = openSentenceId === s.id;
    return `<div class="sentence-item ${isOpen ? 'open' : ''}" data-id="${s.id}">
      <div class="sent-text">${escapeHtml(s.text)}${s.custom ? '<span class="custom-badge">내 문장</span>' : ''}</div>
      <div class="sent-summary">${s.grammar ? escapeHtml(s.grammar) : ''}</div>
      ${isOpen ? renderChunkDisplay(s) : ''}
    </div>`;
  }).join('');
  wrap.querySelectorAll('.sentence-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      openSentenceId = openSentenceId === id ? null : id;
      renderStudyTab();
    });
  });
}

function renderChunkDisplay(s) {
  const chunksHtml = s.chunks.map(ch => `
    <div class="chunk-box">
      <span class="chunk-word tag-${ch.g}">${escapeHtml(ch.t)}</span>
      <span class="chunk-label tag-${ch.g}">${ch.g}</span>
    </div>`).join('');
  return `
    <div class="chunk-line">${chunksHtml}</div>
    ${s.translation ? `<div class="sent-meta">🇰🇷 ${escapeHtml(s.translation)}</div>` : ''}
    ${s.note ? `<div class="sent-note">💡 ${escapeHtml(s.note)}</div>` : ''}
  `;
}

/* ================= practice tab ================= */
let practiceState = null; // {sentence, order:[indices], assigned:{idx:tag}, graded:bool, selectedIdx}
let practiceOrderPerLevel = {}; // level -> shuffled list of sentence ids, and cursor

function getPracticeQueue(level) {
  if (!practiceOrderPerLevel[level]) {
    const ids = shuffle(sentencesForLevel(level).map(s => s.id));
    practiceOrderPerLevel[level] = { ids, cursor: 0 };
  }
  return practiceOrderPerLevel[level];
}

function startPractice(level, sentenceId) {
  const s = sentencesForLevel(level).find(x => x.id === sentenceId);
  if (!s) return;
  practiceState = { sentence: s, assigned: {}, graded: false, selectedIdx: null };
}

function nextPracticeSentence() {
  const q = getPracticeQueue(currentLevel);
  const list = sentencesForLevel(currentLevel);
  if (list.length === 0) { practiceState = null; return; }
  q.cursor = (q.cursor + 1) % q.ids.length;
  startPractice(currentLevel, q.ids[q.cursor]);
}

function renderPracticeTab() {
  document.getElementById('legendPractice').innerHTML = legendHtml();
  const list = sentencesForLevel(currentLevel);
  const st = getLevelStats(currentLevel);
  document.getElementById('practiceProgress').textContent =
    `${currentLevel} · 지금까지 ${st.attempted}문장 연습, 문장 완벽정답 ${st.correctSentences}개 / 청크 정확도 ${st.chunkTotal ? Math.round(st.chunkCorrect / st.chunkTotal * 100) : 0}%`;

  const area = document.getElementById('practiceArea');
  if (list.length === 0) {
    area.innerHTML = '<p class="empty-note">이 난이도에는 아직 연습할 문장이 없어요.</p>';
    return;
  }
  if (!practiceState || practiceState.sentence.level !== currentLevel) {
    const q = getPracticeQueue(currentLevel);
    startPractice(currentLevel, q.ids[q.cursor % q.ids.length]);
  }

  const s = practiceState.sentence;
  const chunksHtml = s.chunks.map((ch, i) => {
    const assignedTag = practiceState.assigned[i];
    let cls = 'pchunk';
    if (practiceState.selectedIdx === i) cls += ' selected';
    if (practiceState.graded) {
      cls += (assignedTag === ch.g) ? ' graded-correct' : ' graded-wrong';
    }
    const badge = assignedTag ? `<span class="assigned-tag tag-${assignedTag}">${assignedTag}</span>` : '';
    const wrongNote = (practiceState.graded && assignedTag !== ch.g)
      ? `<span class="mark no">정답: ${ch.g}</span>` : (practiceState.graded ? `<span class="mark ok">✓</span>` : '');
    return `<span class="pchunk-wrap" style="display:inline-flex;align-items:center;gap:4px;">
      <span class="${cls}" data-idx="${i}">${escapeHtml(ch.t)}${badge}</span>${wrongNote}
    </span>`;
  }).join(' ');

  const allAssigned = s.chunks.every((_, i) => practiceState.assigned[i]);

  area.innerHTML = `
    <div class="practice-sentence-src">문장을 하나씩 클릭한 뒤, 아래 태그 버튼으로 역할을 지정해보세요.</div>
    <div class="chunk-line" id="pchunkLine">${chunksHtml}</div>
    <div class="tag-picker" id="tagPicker">
      ${TAGS.map(t => `<button class="tag-btn tag-btn-${t}" data-tag="${t}" ${practiceState.graded ? 'disabled' : ''}>${t} (${TAG_NAMES[t]})</button>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn primary" id="gradeBtn" ${(!allAssigned || practiceState.graded) ? 'disabled' : ''}>채점하기</button>
      <button class="btn" id="resetBtn" ${practiceState.graded ? 'disabled' : ''}>다시 선택</button>
      <button class="btn" id="nextBtn">다음 문장 →</button>
    </div>
    <div id="resultBox"></div>
  `;

  area.querySelectorAll('.pchunk').forEach(el => {
    el.addEventListener('click', () => {
      if (practiceState.graded) return;
      practiceState.selectedIdx = Number(el.dataset.idx);
      renderPracticeTab();
    });
  });
  area.querySelectorAll('.tag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (practiceState.selectedIdx === null || practiceState.graded) return;
      practiceState.assigned[practiceState.selectedIdx] = btn.dataset.tag;
      practiceState.selectedIdx = null;
      renderPracticeTab();
    });
  });
  const gradeBtn = document.getElementById('gradeBtn');
  if (gradeBtn) gradeBtn.addEventListener('click', gradePractice);
  document.getElementById('resetBtn').addEventListener('click', () => {
    practiceState.assigned = {};
    practiceState.selectedIdx = null;
    renderPracticeTab();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    nextPracticeSentence();
    renderPracticeTab();
  });

  if (practiceState.graded) renderResultBox();
}

function gradePractice() {
  practiceState.graded = true;
  const s = practiceState.sentence;
  const total = s.chunks.length;
  const correct = s.chunks.filter((ch, i) => practiceState.assigned[i] === ch.g).length;
  recordAttempt(currentLevel, total, correct);
  renderLevelRow();
  renderPracticeTab();
}

function renderResultBox() {
  const s = practiceState.sentence;
  const total = s.chunks.length;
  const correct = s.chunks.filter((ch, i) => practiceState.assigned[i] === ch.g).length;
  const perfect = correct === total;
  const box = document.getElementById('resultBox');
  box.innerHTML = `
    <div class="result-box ${perfect ? '' : 'bad'}">
      <strong>${perfect ? '🎉 완벽해요!' : `${correct} / ${total} 개 정답`}</strong>
      ${s.translation ? `<div class="sent-meta">🇰🇷 ${escapeHtml(s.translation)}</div>` : ''}
      ${s.note ? `<div class="sent-note">💡 ${escapeHtml(s.note)}</div>` : ''}
    </div>
  `;
}

/* ================= add tab ================= */
let addChunkDraft = [];

function renderAddLevelSelect() {
  const sel = document.getElementById('addLevel');
  sel.innerHTML = LEVELS.map(lv => `<option value="${lv}" ${lv === currentLevel ? 'selected' : ''}>${lv}</option>`).join('');
}

document.getElementById('addParseBtn').addEventListener('click', () => {
  const raw = document.getElementById('addChunksRaw').value;
  const parts = raw.split('/').map(p => p.trim()).filter(Boolean);
  if (parts.length === 0) { alert('청크를 하나 이상 입력해주세요.'); return; }
  addChunkDraft = parts.map(p => ({ t: p, g: 'S' }));
  renderAddChunkTagArea();
});

function renderAddChunkTagArea() {
  const wrap = document.getElementById('addChunkTagArea');
  if (addChunkDraft.length === 0) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <h3>각 청크의 역할을 선택하세요</h3>
    <div class="custom-chunk-preview">
      ${addChunkDraft.map((d, i) => `
        <span class="chunk-box">
          <span class="chunk-word tag-${d.g}">${escapeHtml(d.t)}</span>
          <select data-idx="${i}" class="chunkTagSelect" style="font-size:11px; padding:2px 4px;">
            ${TAGS.map(t => `<option value="${t}" ${t === d.g ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </span>
      `).join('')}
    </div>
  `;
  wrap.querySelectorAll('.chunkTagSelect').forEach(sel => {
    sel.addEventListener('change', () => {
      addChunkDraft[Number(sel.dataset.idx)].g = sel.value;
      renderAddChunkTagArea();
    });
  });
}

document.getElementById('addSaveBtn').addEventListener('click', () => {
  if (addChunkDraft.length === 0) { alert('먼저 "청크 나누기" 버튼으로 문장을 나눠주세요.'); return; }
  const level = document.getElementById('addLevel').value;
  const grammar = document.getElementById('addGrammar').value.trim();
  const translation = document.getElementById('addTranslation').value.trim();
  const text = addChunkDraft.map(d => d.t).join(' ');
  const sentence = {
    id: 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    level, text, grammar, translation,
    chunks: addChunkDraft.map(d => ({ t: d.t, g: d.g })),
    custom: true
  };
  customSentences.push(sentence);
  saveCustom(customSentences);
  addChunkDraft = [];
  document.getElementById('addChunksRaw').value = '';
  document.getElementById('addChunkTagArea').innerHTML = '';
  document.getElementById('addGrammar').value = '';
  document.getElementById('addTranslation').value = '';
  alert('문장이 저장되었어요!');
  practiceOrderPerLevel[level] = null;
  renderAll();
});

function renderCustomList() {
  const wrap = document.getElementById('customList');
  if (customSentences.length === 0) {
    wrap.innerHTML = '<p class="empty-note">아직 추가한 문장이 없어요.</p>';
    return;
  }
  wrap.innerHTML = customSentences.map(s => `
    <div class="sentence-item">
      <div class="sent-text">[${s.level}] ${escapeHtml(s.text)}</div>
      <div class="sent-summary">${s.grammar ? escapeHtml(s.grammar) : ''}</div>
      <div class="btn-row">
        <button class="btn small danger" data-id="${s.id}">삭제</button>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('이 문장을 삭제할까요?')) return;
      customSentences = customSentences.filter(s => s.id !== btn.dataset.id);
      saveCustom(customSentences);
      practiceOrderPerLevel = {};
      renderAll();
    });
  });
}

/* ================= stats tab ================= */
function renderStatsTab() {
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = LEVELS.map(lv => {
    const st = getLevelStats(lv);
    const total = sentencesForLevel(lv).length;
    const acc = st.chunkTotal ? Math.round(st.chunkCorrect / st.chunkTotal * 100) : 0;
    return `
      <h3>${lv}</h3>
      <div class="stats-grid">
        <div class="stat-cell"><div class="num">${total}</div><div class="lbl">전체 문장</div></div>
        <div class="stat-cell"><div class="num">${st.attempted}</div><div class="lbl">연습 횟수</div></div>
        <div class="stat-cell"><div class="num">${st.correctSentences}</div><div class="lbl">완벽 정답</div></div>
        <div class="stat-cell"><div class="num">${acc}%</div><div class="lbl">청크 정확도</div></div>
      </div>
    `;
  }).join('');
}

document.getElementById('resetStatsBtn').addEventListener('click', () => {
  if (!confirm('모든 학습 기록을 초기화할까요? 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(STATS_KEY);
  renderAll();
});

/* ================= tabs ================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    renderAll();
  });
});

/* ================= utils ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* ================= init ================= */
function renderAll() {
  renderLevelRow();
  renderStudyTab();
  renderPracticeTab();
  renderAddLevelSelect();
  renderCustomList();
  renderStatsTab();
}
renderAll();
</script>
</body>
</html>
